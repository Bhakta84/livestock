services:
  - type: web
    name: bldcl-eprocurement-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: bldcl-eprocurement-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://bldcl-eprocurement.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bldcl-eprocurement-db
          property: connectionString

  - type: web
    name: bldcl-eprocurement
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://bldcl-eprocurement-api.onrender.com

databases:
  - name: bldcl-eprocurement-db